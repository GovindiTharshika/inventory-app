<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABC Inventory</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#1f2937}header{background:#4c1d95;color:#fff;padding:22px 7%}main{max-width:1050px;margin:28px auto;padding:0 20px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px #0001;margin-bottom:20px}form{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr auto;gap:10px}input,button{padding:10px;border:1px solid #d1d5db;border-radius:6px}button{background:#6d28d9;color:#fff;border:0;cursor:pointer}.delete{background:#dc2626}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #e5e7eb}.low{color:#b91c1c;font-weight:bold}@media(max-width:750px){form{grid-template-columns:1fr}.card{overflow:auto}}</style></head>
<body><header><h1>ABC Retail Inventory</h1><div>Spring Boot DevOps Lab Application</div></header><main><section class="card"><h2>Add Product</h2><form id="form"><input id="name" placeholder="Product name" required><input id="category" placeholder="Category" required><input id="quantity" type="number" min="0" placeholder="Quantity" required><input id="price" type="number" min="0" step="0.01" placeholder="Price" required><button>Add</button></form></section><section class="card"><h2>Current Inventory</h2><table><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Quantity</th><th>Price</th><th>Stock Value</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>const api='/api/products';const money=n=>'$'+Number(n).toFixed(2);async function load(){const ps=await fetch(api).then(r=>r.json());rows.innerHTML=ps.map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.category}</td><td class="${p.quantity<10?'low':''}">${p.quantity}${p.quantity<10?' (Low)':''}</td><td>${money(p.price)}</td><td>${money(p.quantity*p.price)}</td><td><button class="delete" onclick="removeProduct(${p.id})">Delete</button></td></tr>`).join('')}form.onsubmit=async e=>{e.preventDefault();await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,category:category.value,quantity:+quantity.value,price:+price.value})});form.reset();load()};async function removeProduct(id){await fetch(api+'/'+id,{method:'DELETE'});load()}load();</script></body></html>
